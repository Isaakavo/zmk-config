# Corne OLED Display (nice!view with the gem status screen)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_SLEEP=y

# Gem view animation config
# Animation off and a fixed frame to save battery.
CONFIG_NICE_VIEW_GEM_ANIMATION=n
CONFIG_NICE_VIEW_GEM_ANIMATION_FRAME=8

# RGB Underglow
# ZMK_RGB_UNDERGLOW already selects LED_STRIP, and the WS2812 driver is
# enabled from devicetree under Zephyr 4.1, so no strip symbol belongs here.
# Off at boot and switched on with RGB_TOG from the Config layer, so the LEDs
# only cost battery while they are actually on.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
